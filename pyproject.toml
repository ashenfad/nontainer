[project]
name = "nontainer"
version = "0.10.0"
description = "A fake little computer for your agent: versioned filesystem, shell, and sandboxed Python."
readme = "README.md"
license = "MIT"
authors = [
    {name = "ashenfad"},
]
keywords = ["agents", "sandbox", "workspace", "terminal", "versioning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    # The termish, monkeyfs, sandtrap and kvgit floors are the releases
    # whose features nontainer uses; the CHANGELOG says which needed what.
    "termish>=0.2.2",
    "monkeyfs>=0.2.5",
    "sandtrap>=0.4.1",
    # Capped below 0.5: merges resolve through kvgit.versioned.merge,
    # which is not public API.
    "kvgit[disk]>=0.4.1,<0.5",
    # 0.1.3: render() no longer raises on an object whose own __eq__
    # raises, so an agent-written value cannot turn the report of an
    # error into a crash.
    "reprobate>=0.1.3",
]

[project.urls]
"Homepage" = "https://github.com/ashenfad/nontainer"
"Documentation" = "https://github.com/ashenfad/nontainer#readme"
"Bug Tracker" = "https://github.com/ashenfad/nontainer/issues"
"Source" = "https://github.com/ashenfad/nontainer"

[project.optional-dependencies]
agentfs = [
    "agentfs-sdk>=0.6",
]
apps = [
    "playwright>=1.40",
    "starlette>=0.37",
    "anyio>=4",
]
agno = [
    # 2.1 is the first agno with ToolResult and Agent pre/post hooks, and
    # CI tests it beside 2.8 and 3.0. No upper bound: agno 3's breaking
    # changes are in surfaces the adapter does not use.
    "agno>=2.1",
]
mcp = [
    # The adapter targets mcp.server.fastmcp, removed in MCP 2.0.
    # Lift this cap when the MCP 2 adapter migration lands.
    "mcp>=1.0,<2",
]
postgres = [
    # Store(kv="postgresql://...") or NONTAINER_KV: psycopg 3, one pool per Store.
    "kvgit[postgres]>=0.4.1,<0.5",
]
dud = [
    # dud needs Python 3.11+; the marker keeps nontainer's 3.10 floor for
    # everyone else.
    "dud>=0.4.1; python_version >= '3.11'",
]
dev = [
    "ruff",
    "pytest",
    "pytest-asyncio",
    "pytest-xdist",
    "httpx2",
    # exercised by the preset tests (plotly deliberately left out —
    # its preset path is importorskip'd)
    "numpy",
    "pandas",
    "matplotlib",
    # agno's own SqliteDb, which the aborted-run tests use beside the
    # workspace dbs: it stores runs in their own table on agno 3
    "sqlalchemy",
    # table returns: a handler's DataFrame answers as Arrow IPC when
    # the request asks for it, which needs pyarrow in the worker
    "pyarrow",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nontainer"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E731"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
