[project]
name = "nontainer"
version = "0.3.7"
description = "A fake little computer for your agent: versioned filesystem, shell, and sandboxed Python."
readme = "README.md"
license = "MIT"
authors = [
    {name = "ashenfad"},
]
keywords = ["agents", "sandbox", "workspace", "terminal", "versioning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    # 0.1.9: a failing command's stdout survives the raise — curl's
    # error BODY reaches the agent, not just "HTTP 404" (every hint
    # dispatch writes rides in that body)
    "termish>=0.1.9",
    # 0.1.6: bytes/os.PathLike paths, dir_fd arguments, and host
    # directory descriptors no longer bypass filesystem interception —
    # sandboxed code could otherwise read and write the real filesystem
    "monkeyfs>=0.1.6",
    # 0.2.12: Policy.module_root — VFS imports resolve from the
    # workspace root (the /workspace path contract)
    # 0.2.13: close_fds and worker lifecycle fixes — process workers
    # release unrelated host descriptors and inherited control endpoints
    # 0.2.14: StForkUnsafe names a fork-hostile host instead of looping,
    # and worker setup failures report their own traceback
    "sandtrap>=0.3.3",
    # 0.3.2: kvgit.delete_branches — anchor-free admin deletion, so
    # session teardown no longer needs the __void__ anchor dance
    "kvgit[disk]>=0.3.2",
    "reprobate>=0.1.1",
]

[project.urls]
"Homepage" = "https://github.com/ashenfad/nontainer"
"Documentation" = "https://github.com/ashenfad/nontainer#readme"
"Bug Tracker" = "https://github.com/ashenfad/nontainer/issues"
"Source" = "https://github.com/ashenfad/nontainer"

[project.optional-dependencies]
agentfs = [
    "agentfs-sdk>=0.6",
]
apps = [
    "playwright>=1.40",
    "starlette>=0.37",
    "anyio>=4",
]
agno = [
    # The floor is 2.1, not 1.0. Two things set it, and they are
    # different: the adapter imports `agno.tools.function.ToolResult`,
    # which does not exist in agno 1.x at all, and the SHIPPED
    # INTEGRATIONS need `pre_hooks`/`post_hooks` on Agent, which landed
    # in 2.1.0 (examples/analyst.py passes post_hooks; studio passes
    # pre_hooks). A floor that only the adapter clears would still ship
    # an example that cannot run. Verified on 2.1.0 / 2.7.2 / 3.0.1;
    # CI pins it in its own job so the claim keeps being true.
    #
    # No upper bound: agno 3.0's breaking changes are all in surfaces
    # this adapter never touches (the runs table, renamed Agent params,
    # Workflow/HITL, MultiMCPTools). It builds a Toolkit and returns
    # ToolResult, and that has been stable across both majors.
    "agno>=2.1",
]
mcp = [
    # The adapter targets mcp.server.fastmcp, removed in MCP 2.0.
    # Lift this cap when the MCP 2 adapter migration lands.
    "mcp>=1.0,<2",
]
dud = [
    # dud itself requires >=3.11; the marker keeps nontainer's 3.10
    # floor intact for everyone not opting into this executor.
    # 0.2.1: the guest mounts its workspace AT the configured root
    # (/workspace), so agent absolute paths match LocalExecutor's.
    "dud>=0.3.0; python_version >= '3.11'",
]
dev = [
    "ruff",
    "pytest",
    "pytest-asyncio",
    "httpx2",
    # exercised by the preset tests (plotly deliberately left out —
    # its preset path is importorskip'd)
    "numpy",
    "pandas",
    "matplotlib",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nontainer"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E731"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
