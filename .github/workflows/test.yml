name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    # uv resolves from pyproject.toml the way pip did -- the newest
    # releases the constraints allow, not uv.lock -- so the matrix still
    # proves the latest agno and friends work. It is only faster, and
    # its cache keeps the downloads between runs.
    - name: Set up uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
        cache-dependency-glob: pyproject.toml
        cache-suffix: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        # `dud` included so tests/test_dud_executor.py actually RUNS.
        # It guards itself with importorskip, so without the extra the
        # whole DudExecutor suite skipped silently in CI -- which is how
        # a dud breaking change reached us unnoticed. The extra carries a
        # `python_version >= "3.11"` marker, so 3.10 installs nothing for
        # it and those tests keep skipping there, by design.
        uv pip install --system -e ".[dev,apps,agno,mcp,dud]"

    # The browser is keyed on the Playwright version that was installed,
    # so a Playwright release fetches a fresh one. Linux still needs the
    # system libraries on a hit: those live outside the cache.
    - name: Playwright version
      id: pw
      run: echo "version=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browser
      id: pw-cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '~/.cache/ms-playwright' }}
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.pw.outputs.version }}

    - name: Install Playwright browser
      if: steps.pw-cache.outputs.cache-hit != 'true'
      run: python -m playwright install --with-deps chromium

    - name: Install Playwright system dependencies
      if: steps.pw-cache.outputs.cache-hit == 'true' && runner.os == 'Linux'
      run: python -m playwright install-deps chromium

    # One worker per core: the tests are independent (each has its
    # own tmp_path and in-memory stores), and the browser and the
    # sandbox workers they start are per process.
    - name: Run tests
      run: |
        pytest tests/ -v -n auto

    - name: Run linter
      run: |
        ruff check nontainer/

    - name: Check formatting
      run: |
        ruff format --check nontainer/

  # The matrix above installs agno unpinned, so it only ever proves the
  # LATEST release works. That is how `agno>=1.0` went two months
  # claiming support for a version the adapter cannot even import on
  # (agno 1.x has no `ToolResult`). These pins cover the other points:
  # the declared floor, and the current major — so when agno 5 ships and
  # "latest" moves on, 3.x does not silently stop being tested.
  agno-versions:
    strategy:
      matrix:
        # 2.1.0 is the [agno] extra's floor, 2.8.5 the 2.x people run, and
        # 3.0.1 the first agno 3: each runs every agno test. 2.5.0 is the
        # compaction adapter's floor, the first agno whose compression
        # manager holds the seam (#193), and runs the compaction tests;
        # its other differences (an errored run stored with no messages)
        # are agno's.
        include:
          - agno: "2.1.0"
            select: agno
          - agno: "2.5.0"
            select: agno_compaction
          - agno: "2.8.5"
            select: agno
          - agno: "3.0.1"
            select: agno
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
        cache-dependency-glob: pyproject.toml
        cache-suffix: agno-${{ matrix.agno }}
    - name: Install with agno ${{ matrix.agno }}
      run: |
        uv pip install --system -e ".[dev,apps]" "agno==${{ matrix.agno }}"
    - name: Confirm the pin actually took
      # Belt and braces: an overlay that silently loses to an already
      # installed agno would make every assertion below vacuous, and a
      # green run would mean nothing. This bit us locally — `uv run
      # --with agno==X pytest` runs the PROJECT's pytest, not the
      # overlay's, so four "passes on 3.0.1" results were really the
      # installed 2.6.22.
      run: |
        python -c "import agno, sys; \
          assert agno.__version__ == '${{ matrix.agno }}', agno.__version__; \
          print('agno', agno.__version__)"
    - name: Run the agno adapter tests
      run: python -m pytest tests/ -v -k ${{ matrix.select }}

  # The whole suite again with every Store keeping its kvgit data in
  # PostgreSQL rather than on disk (tests/conftest.py gives each store
  # path its own table). Tests of the on-disk layout itself are marked
  # disk_only and skip here.
  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NONTAINER_TEST_KV: postgres
      NONTAINER_TEST_PG_DSN: host=localhost user=postgres password=postgres dbname=nontainer_test
      NONTAINER_TEST_PG_URL: postgresql://postgres:postgres@localhost/nontainer_test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Set up uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
        cache-dependency-glob: pyproject.toml
        cache-suffix: postgres

    - name: Install dependencies
      run: |
        uv pip install --system -e ".[dev,apps,agno,mcp,dud,postgres]"

    # The app tests publish to the store and serve from it, and they run
    # only with a browser: without one they skip, and the store's
    # publication paths would go untested here.
    # The browser is keyed on the Playwright version that was installed,
    # so a Playwright release fetches a fresh one. Linux still needs the
    # system libraries on a hit: those live outside the cache.
    - name: Playwright version
      id: pw
      run: echo "version=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browser
      id: pw-cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '~/.cache/ms-playwright' }}
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.pw.outputs.version }}

    - name: Install Playwright browser
      if: steps.pw-cache.outputs.cache-hit != 'true'
      run: python -m playwright install --with-deps chromium

    - name: Install Playwright system dependencies
      if: steps.pw-cache.outputs.cache-hit == 'true' && runner.os == 'Linux'
      run: python -m playwright install-deps chromium

    - name: Run the whole suite on Postgres
      run: |
        pytest tests/ -q -n auto
