name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,apps,agno,mcp]"

    - name: Install Playwright browser
      run: python -m playwright install --with-deps chromium

    - name: Run tests
      run: |
        pytest tests/ -v

    - name: Run linter
      run: |
        ruff check nontainer/

    - name: Check formatting
      run: |
        ruff format --check nontainer/

  # The matrix above installs agno unpinned, so it only ever proves the
  # LATEST release works. That is how `agno>=1.0` went two months
  # claiming support for a version the adapter cannot even import on
  # (agno 1.x has no `ToolResult`). This job exercises the declared
  # floor, so the constraint stays a tested claim rather than a guess.
  agno-floor:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install with the OLDEST supported agno
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,apps]"
        pip install "agno==2.0.0"
    - name: Run the agno adapter tests
      run: pytest tests/ -v -k agno
